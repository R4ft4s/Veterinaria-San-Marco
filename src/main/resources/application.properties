spring.application.name=veterinaria-san-marcos
server.port=8080

# ---------- Base de datos (MariaDB de XAMPP) ----------
# Si MySQL de XAMPP usa otro puerto (p. ej. 3307), cámbialo aquí.
# createDatabaseIfNotExist necesita que el usuario tenga permiso para crear bases de datos.
spring.datasource.url=jdbc:mariadb://localhost:3306/veterinaria_san_marcos?createDatabaseIfNotExist=true
spring.datasource.username=root
# XAMPP trae root sin contraseña por defecto.
spring.datasource.password=

# JPA: crea/actualiza las tablas automáticamente a partir de las entidades.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Fechas en formato ISO, no como números.
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Seguridad ----------
# Cambia este secreto (mínimo 32 caracteres) o define la variable de entorno JWT_SECRET.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=480

# Orígenes del frontend (Vite usa 5173).
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Inserta categorías, productos y las 3 cuentas demo si las tablas están vacías.
app.seed.enabled=true
